<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Observability Demo Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --elastic-blue: #0B64DD;
            --teal: #48EFCF;
            --teal-dim: #2EC9B0;
            --yellow: #FEC514;
            --light-poppy: #FF957D;
            --pink: #F04E98;
            --dev-blue: #101C3F;
            --dark-ink: #1C1E23;
            --ink: #343741;
            --light-grey: #F5F7FA;
            --bg: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-input: #FFFFFF;
            --border: rgba(16, 28, 63, 0.18);
            --border-card: #101C3F;
            --text: #1C1E23;
            --text-dim: #343741;
            --text-muted: #69707D;
            --white: #FFFFFF;
            --green: #3FB950;
            --amber: #FEC514;
            --red: #FF957D;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header — Elastic Blue hero */
        .header {
            background: var(--elastic-blue);
            padding: 48px 40px 40px;
            text-align: center;
            color: var(--white);
        }
        .header-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .header-logo svg {
            width: 32px;
            height: 32px;
        }
        .header-brand {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 8px;
        }
        .header p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.80);
            max-width: 600px;
            margin: 0 auto;
        }
        .header-accent {
            width: 60px;
            height: 3px;
            background: var(--teal);
            border-radius: 2px;
            margin: 20px auto 0;
        }

        /* Scenario Cards Grid */
        .scenarios {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .scenarios-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 3px solid var(--teal);
            display: inline-block;
        }
        .scenario-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .scenario-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border-card);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 1px 4px rgba(16, 28, 63, 0.07);
        }
        .scenario-card:hover {
            box-shadow: 0 4px 14px rgba(16, 28, 63, 0.14);
        }
        .scenario-card.is-deployed {
            border-color: var(--elastic-blue);
            border-width: 2px;
        }
        .scenario-card .card-body {
            flex: 1;
        }
        .scenario-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }
        .scenario-card h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }
        .scenario-card p {
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.5;
        }
        .scenario-ns {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            font-family: 'Space Mono', 'Consolas', monospace;
            color: var(--elastic-blue);
            background: rgba(11, 100, 221, 0.08);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .scenario-actions {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card-btn {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .card-btn-launch { background: var(--elastic-blue); color: #fff; }
        .card-btn-launch:hover { background: #0f6fe8; }
        .card-btn-deploying {
            background: rgba(11, 100, 221, 0.12);
            color: rgba(28, 30, 35, 0.45);
            cursor: not-allowed;
        }
        .card-btn-exec { background: #238636; color: #fff; border-color: #238636; }
        .card-btn-exec:hover { background: #2ea043; border-color: #2ea043; }
        .card-btn-ops { background: var(--elastic-blue); color: #fff; border-color: var(--elastic-blue); opacity: 0.82; }
        .card-btn-ops:hover { opacity: 1; }
        .card-btn-chaos { background: var(--yellow); color: var(--dark-ink); border-color: var(--yellow); }
        .card-btn-chaos:hover { background: #e6b310; border-color: #e6b310; }
        .card-btn-teardown { background: #BD271E; color: #fff; }
        .card-btn-teardown:hover { background: #a8221a; }
        .card-btn-teardown[disabled] {
            background: rgba(189, 39, 30, 0.18);
            color: rgba(28, 30, 35, 0.35);
            cursor: not-allowed;
        }
        .card-error {
            margin-top: 10px;
            color: var(--light-poppy);
            font-size: 12px;
            line-height: 1.4;
        }

        /* Connection Panel */
        .connection {
            padding: 0 40px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .connection-panel {
            background: var(--light-grey);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            display: none;
        }
        .connection-panel.visible { display: block; }
        .connection-panel h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            background: var(--bg-input);
            border: 1px solid rgba(16, 28, 63, 0.25);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: var(--elastic-blue);
            box-shadow: 0 0 0 2px rgba(11, 100, 221, 0.12);
        }
        .form-group input::placeholder {
            color: #aab0bb;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--elastic-blue);
            color: var(--white);
        }
        .btn-primary:hover {
            background: #0f6fe8;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: var(--white);
            color: var(--text);
            border: 1.5px solid var(--border-card);
        }
        .btn-secondary:hover {
            border-color: var(--elastic-blue);
            color: var(--elastic-blue);
        }
        .btn-icon {
            margin-right: 6px;
        }

        /* Advanced settings */
        .advanced-settings {
            margin-bottom: 24px;
        }
        .advanced-settings summary {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 0;
            user-select: none;
        }
        .advanced-settings summary:hover {
            color: var(--elastic-blue);
        }
        .advanced-settings .form-group input {
            font-size: 13px;
            color: var(--text-muted);
        }
        .advanced-settings .form-group input:not(:placeholder-shown) {
            color: var(--text);
        }

        /* Status message */
        .status-msg {
            font-size: 13px;
            margin-left: 12px;
            display: none;
        }
        .status-msg.visible { display: inline; }
        .status-msg.ok { color: var(--green); }
        .status-msg.err { color: var(--light-poppy); }
        .status-msg.info { color: var(--elastic-blue); }

        /* Connection check indicators */
        .conn-check {
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }
        .conn-check.conn-ok  { color: var(--green); }
        .conn-check.conn-fail { color: var(--light-poppy); }

        /* Progress Panels */
        #progress-panels-container {
            padding: 0 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .progress-panel {
            margin-bottom: 16px;
        }
        .progress-inner {
            background: var(--light-grey);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px 32px;
        }
        .progress-inner h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 16px;
        }
        .progress-step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            font-size: 14px;
        }
        .step-icon {
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        .step-icon.pending { color: var(--text-muted); }
        .step-icon.running { color: var(--elastic-blue); }
        .step-icon.ok { color: var(--green); }
        .step-icon.failed { color: var(--light-poppy); }
        .step-icon.skipped { color: var(--text-muted); }
        .step-name { color: var(--text); flex: 1; }
        .step-detail { color: var(--text-dim); font-size: 12px; }
        .step-count { color: var(--elastic-blue); font-size: 12px; font-family: 'Space Mono', monospace; }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--elastic-blue);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        .footer a {
            color: var(--elastic-blue);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-logo">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="16" cy="16" r="13" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="7" fill="rgba(255,255,255,0.2)" stroke="#48EFCF" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="2.5" fill="#48EFCF"/>
            </svg>
            <span class="header-brand">Elastic Observability</span>
        </div>
        <h1>Demo Platform</h1>
        <p>Select a scenario, connect your Elastic environment, and launch a fully instrumented observability demo.</p>
        <div class="header-accent"></div>
    </div>

    <!-- Connection Panel -->
    <div class="connection">
        <div class="connection-panel" id="connection-panel">
            <h2>Connection Settings</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Kibana URL <span class="conn-check" id="check-kibana"></span></label>
                    <input type="url" id="kibana-url" placeholder="https://my-cluster.kb.us-east-1.aws.elastic.cloud" oninput="deriveUrls(); clearConnChecks()">
                </div>
                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="api-key" placeholder="Base64-encoded API key" oninput="clearConnChecks()">
                </div>
            </div>
            <details class="advanced-settings">
                <summary>Advanced (auto-derived from Kibana URL)</summary>
                <div class="form-grid" style="margin-top: 12px;">
                    <div class="form-group">
                        <label>Elasticsearch URL <span class="conn-check" id="check-es"></span></label>
                        <input type="url" id="es-url" placeholder="Auto-derived from Kibana URL" oninput="clearConnChecks()">
                    </div>
                    <div class="form-group">
                        <label>OTLP Endpoint <span class="conn-check" id="check-otlp"></span></label>
                        <input type="url" id="otlp-url" placeholder="Auto-derived from Kibana URL" oninput="clearConnChecks()">
                    </div>
                </div>
            </details>
            <div class="btn-row">
                <button class="btn btn-secondary" onclick="testConnection()">
                    <span class="btn-icon">&#9889;</span>Test Connection
                </button>
                <span class="status-msg" id="status-msg"></span>
            </div>
        </div>
    </div>

    <!-- Scenario Cards -->
    <div class="scenarios">
        <div class="scenarios-label">Choose a Scenario</div>
        <div class="scenario-grid" id="scenario-grid">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Progress Panels Container -->
    <div id="progress-panels-container"></div>

    <div class="footer">
        Powered by <a href="https://elastic.co" target="_blank">Elastic</a> Observability
    </div>

<script>

    let scenarios = [];
    let activeDeployments = [];
    let envCreds = false;
    const tearingDownIds = new Set();
    const tearingDownScenarioIds = new Set();
    const deployingIds = new Set();
    const queuedDeployIds = new Set();      // scenario_id while deploy is queued
    const queuedTeardownIds = new Set();    // deployment_id while teardown is queued
    const queuePositions = new Map();       // scenario_id or deployment_id → "2 of 3"
    const deployOrder = new Map();          // scenario_id → first-seen sequence number
    const teardownOrder = new Map();        // deployment_id → first-seen sequence number
    let _orderSeq = 0;
    function noteDeployOrder(id) { if (!deployOrder.has(id)) deployOrder.set(id, ++_orderSeq); }
    function noteTeardownOrder(id) { if (!teardownOrder.has(id)) teardownOrder.set(id, ++_orderSeq); }
    function parseQueuePos(id) {
        const s = queuePositions.get(id);
        if (!s) return Infinity;
        const m = s.match(/^(\d+) of/);
        return m ? parseInt(m[1], 10) : Infinity;
    }
    const cardErrors = new Map();

    async function init() {
        // Check if credentials are pre-configured via .env
        try {
            const cfg = await (await fetch('/api/setup/env-creds')).json();
            envCreds = cfg.has_env_creds || false;
        } catch (e) {
            envCreds = false;
        }

        // Show credentials panel up-front when not using env creds.
        if (!envCreds) {
            document.getElementById('connection-panel').classList.add('visible');
        }

        // Load scenarios
        try {
            scenarios = await (await fetch('/api/scenarios')).json();
        } catch (e) {
            scenarios = [];
        }

        // Load active deployments
        await refreshDeployments();

        // Resume any deployments that were in progress before a page refresh
        try {
            const status = await (await fetch('/api/setup/active-deploys')).json();
            for (const dep of (status.deployments || [])) {
                deployingIds.add(dep.scenario_id);
                noteDeployOrder(dep.scenario_id);
                const panelId = 'progress-panel-deploy-' + dep.deployment_id;
                if (!document.getElementById(panelId)) {
                    createProgressPanel(panelId, 'Deploying ' + dep.scenario_name + '…');
                    pollProgress(dep.deployment_id, dep.scenario_id);
                }
            }
        } catch (e) {}

        // Resume any teardowns that were running before a page refresh
        try {
            const tdStatus = await (await fetch('/api/setup/active-teardowns')).json();
            for (const td of (tdStatus.teardowns || [])) {
                tearingDownIds.add(td.deployment_id);
                noteTeardownOrder(td.deployment_id);
                if (td.scenario_id) tearingDownScenarioIds.add(td.scenario_id);
                createProgressPanel('progress-panel-teardown-' + td.deployment_id, 'Removing ' + td.scenario_name + '…');
                pollTeardownProgress(td.deployment_id, td.scenario_name, td.scenario_id);
            }
        } catch (e) {}

        renderScenarios();
    }

    async function refreshDeployments() {
        try {
            activeDeployments = await (await fetch('/api/deployments')).json();
        } catch (e) {
            activeDeployments = [];
        }
        renderScenarios();
    }

    function sortScenariosByDeployment(list) {
        const runningIds = new Set(activeDeployments.filter(d => d.running).map(d => d.scenario_id));
        const deploymentIdByScenario = new Map(activeDeployments.map(d => [d.scenario_id, d.deployment_id]));
        const rank = (s) => {
            // Tearing-down scenarios are still in activeDeployments until teardown
            // finishes, so check tearing-down BEFORE deployed.
            if (tearingDownScenarioIds.has(s.id)) return 2;   // tearing down
            if (runningIds.has(s.id)) return 0;               // deployed
            if (deployingIds.has(s.id)) return 1;             // deploying (incl. queued)
            return 3;                                         // not deployed
        };
        // Within "deploying" and "tearing down" groups: actively-running ops
        // (no queue position) first in start order, then queued ops in queue
        // position order.
        const subRank = (s, r) => {
            if (r === 1) {
                const queued = queuedDeployIds.has(s.id);
                return [queued ? 1 : 0, queued ? parseQueuePos(s.id) : (deployOrder.get(s.id) ?? Infinity)];
            }
            if (r === 2) {
                const depId = deploymentIdByScenario.get(s.id);
                if (!depId) return [0, Infinity];
                const queued = queuedTeardownIds.has(depId);
                return [queued ? 1 : 0, queued ? parseQueuePos(depId) : (teardownOrder.get(depId) ?? Infinity)];
            }
            return [0, 0];
        };
        return [...list].sort((a, b) => {
            const ra = rank(a), rb = rank(b);
            if (ra !== rb) return ra - rb;
            const [sa1, sa2] = subRank(a, ra);
            const [sb1, sb2] = subRank(b, rb);
            if (sa1 !== sb1) return sa1 - sb1;
            if (sa2 !== sb2) return sa2 - sb2;
            return list.indexOf(a) - list.indexOf(b);
        });
    }

    function renderScenarios() {
        const grid = document.getElementById('scenario-grid');
        grid.innerHTML = '';
        sortScenariosByDeployment(scenarios).forEach(s => {
            const dep = activeDeployments.find(d => d.scenario_id === s.id && d.running);
            const isDeploying = deployingIds.has(s.id);
            const isTearingDown = tearingDownScenarioIds.has(s.id) || (dep && tearingDownIds.has(dep.deployment_id));
            const card = document.createElement('div');
            card.className = 'scenario-card' + (dep || isTearingDown ? ' is-deployed' : '');
            card.dataset.id = s.id;

            const runningPill = (dep || isTearingDown)
                ? `<span style="position: absolute; top: 10px; right: 10px; background: #48EFCF; color: #101C3F;
                       font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.5px;">RUNNING</span>`
                : '';

            const deployPos = queuePositions.get(s.id);
            const deployLabel = queuedDeployIds.has(s.id)
                ? `Queued${deployPos ? ' (' + deployPos + ')' : ''}…`
                : 'Deploying…';
            const tdDepId = dep ? dep.deployment_id : null;
            const tdPos = tdDepId ? queuePositions.get(tdDepId) : null;
            const teardownLabel = (tdDepId && queuedTeardownIds.has(tdDepId))
                ? `Queued${tdPos ? ' (' + tdPos + ')' : ''}…`
                : 'Removing…';

            let actions = '';
            if (isDeploying) {
                actions = `<button class="card-btn card-btn-deploying" disabled>${deployLabel}</button>`;
            } else if (isTearingDown) {
                actions = `<button class="card-btn card-btn-teardown" disabled>${teardownLabel}</button>`;
            } else if (dep) {
                actions = `
                    <a class="card-btn card-btn-exec" href="${dep.kibana_display_url}/app/dashboards#/view/${dep.namespace}-business-exec-dashboard" target="_blank" rel="noopener">Business Dashboard</a>
                    <a class="card-btn card-btn-ops" href="${dep.kibana_display_url}/app/dashboards#/view/${dep.namespace}-exec-dashboard" target="_blank" rel="noopener">Operations Dashboard</a>
                    <a class="card-btn card-btn-chaos" href="/chaos?deployment_id=${dep.deployment_id}">Chaos</a>
                    <button class="card-btn card-btn-teardown" onclick="stopAndTeardown('${dep.deployment_id}')">Stop &amp; Teardown</button>
                `;
            } else {
                actions = `<button class="card-btn card-btn-launch" onclick="launchScenario('${s.id}')">&#9654; Launch</button>`;
            }

            const err = cardErrors.get(s.id);
            const errorBlock = err ? `<div class="card-error">${err}</div>` : '';

            card.innerHTML = `
                ${runningPill}
                <div class="card-body">
                    <div class="scenario-icon">${s.icon || '\uD83D\uDD27'}</div>
                    <h3>${s.name}</h3>
                    <p>${s.description}</p>
                    <span class="scenario-ns">${s.namespace}</span>
                </div>
                <div class="scenario-actions">${actions}</div>
                ${errorBlock}
            `;
            grid.appendChild(card);
        });
    }

    function deriveUrls() {
        const kibanaUrl = document.getElementById('kibana-url').value.trim();
        const esInput = document.getElementById('es-url');
        const otlpInput = document.getElementById('otlp-url');

        if (kibanaUrl && kibanaUrl.includes('.kb.')) {
            if (!esInput.dataset.manual) {
                esInput.value = kibanaUrl.replace('.kb.', '.es.');
            }
            if (!otlpInput.dataset.manual) {
                let otlp = kibanaUrl.replace('.kb.', '.ingest.').replace(/\/+$/, '');
                if (!otlp.endsWith(':443')) otlp += ':443';
                otlpInput.value = otlp;
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        ['es-url', 'otlp-url'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', () => { el.dataset.manual = '1'; });
        });
    });

    function setConnCheck(id, ok) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = ok ? '✅' : '❌';
        el.className = 'conn-check ' + (ok ? 'conn-ok' : 'conn-fail');
    }

    function clearConnChecks() {
        ['check-kibana', 'check-es', 'check-otlp'].forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.textContent = ''; el.className = 'conn-check'; }
        });
    }

    async function testConnection() {
        const kibanaUrl = document.getElementById('kibana-url').value.trim();
        const key = document.getElementById('api-key').value.trim();
        const msg = document.getElementById('status-msg');

        if (!kibanaUrl || !key) {
            msg.textContent = 'Enter Kibana URL and API key';
            msg.className = 'status-msg visible err';
            return;
        }

        clearConnChecks();
        msg.textContent = 'Testing...';
        msg.className = 'status-msg visible info';

        const esUrl = document.getElementById('es-url').value.trim() || undefined;
        const otlpUrl = document.getElementById('otlp-url').value.trim() || undefined;

        try {
            const resp = await fetch('/api/setup/test-connection', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    kibana_url: kibanaUrl,
                    api_key: key,
                    elastic_url: esUrl,
                    otlp_url: otlpUrl,
                }),
            });
            const data = await resp.json();

            // Set per-component checkmarks (only for components that were tested)
            if ('kibana_ok' in data) setConnCheck('check-kibana', data.kibana_ok);
            if ('es_ok'     in data) setConnCheck('check-es',     data.es_ok);
            if ('otlp_ok'   in data) setConnCheck('check-otlp',   data.otlp_ok);

            // Build status line from tested components only
            const parts = [];
            if ('kibana_ok' in data)
                parts.push('Kibana: '        + (data.kibana_ok ? 'OK' : (data.kibana_error || 'Failed')));
            if ('es_ok' in data)
                parts.push('Elasticsearch: ' + (data.es_ok     ? 'OK' : (data.es_error    || 'Failed')));
            if ('otlp_ok' in data)
                parts.push('OTLP: '          + (data.otlp_ok   ? 'OK' : (data.otlp_error  || 'Failed')));

            const anyFail = data.kibana_ok === false || data.es_ok === false || data.otlp_ok === false;
            msg.textContent = parts.join(' | ') || (data.error || 'Unknown error');
            msg.className   = 'status-msg visible ' + (anyFail ? 'err' : 'ok');

            // Populate derived URLs if field is empty or not manually set
            const esField = document.getElementById('es-url');
            if (data.elastic_url && (!esField.value || !esField.dataset.manual))
                esField.value = data.elastic_url;
            const otlpField = document.getElementById('otlp-url');
            if (data.otlp_endpoint && (!otlpField.value || !otlpField.dataset.manual))
                otlpField.value = data.otlp_endpoint;
        } catch (e) {
            msg.textContent = 'Connection test endpoint not available — you can still launch';
            msg.className = 'status-msg visible info';
        }
    }

    async function launchScenario(scenarioId) {
        if (!scenarioId) return;
        if (deployingIds.has(scenarioId)) return;

        const usingEnvCreds = envCreds;
        const body = { scenario_id: scenarioId };
        if (!usingEnvCreds) {
            const kibanaUrl = document.getElementById('kibana-url').value.trim();
            const apiKey = document.getElementById('api-key').value.trim();
            const esUrl = document.getElementById('es-url').value.trim() || undefined;
            const otlpUrl = document.getElementById('otlp-url').value.trim() || undefined;
            body.kibana_url = kibanaUrl;
            body.api_key = apiKey;
            if (esUrl) body.elastic_url = esUrl;
            if (otlpUrl) body.otlp_url = otlpUrl;
        }

        cardErrors.delete(scenarioId);
        deployingIds.add(scenarioId);
        noteDeployOrder(scenarioId);
        renderScenarios();

        try {
            const resp = await fetch('/api/setup/launch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body),
            });
            const data = await resp.json();
            if (data.error) {
                deployingIds.delete(scenarioId);
                deployOrder.delete(scenarioId);
                cardErrors.set(scenarioId, 'Launch failed: ' + data.error);
                renderScenarios();
                return;
            }

            const deployId = data.deployment_id || scenarioId;
            const scenarioObj = scenarios.find(x => x.id === scenarioId);
            const scenarioLabel = scenarioObj ? scenarioObj.name : scenarioId;
            createProgressPanel('progress-panel-deploy-' + deployId, 'Deploying ' + scenarioLabel + '…');
            pollProgress(deployId, scenarioId);
        } catch (e) {
            deployingIds.delete(scenarioId);
            cardErrors.set(scenarioId, 'Launch error: ' + e.message);
            renderScenarios();
        }
    }

    function createProgressPanel(panelId, title) {
        const container = document.getElementById('progress-panels-container');
        const panel = document.createElement('div');
        panel.className = 'progress-panel';
        panel.id = panelId;
        panel.innerHTML = `<div class="progress-inner"><h2>${title}</h2><div class="progress-steps-inner"><div class="progress-step"><span class="step-icon running"><span class="spinner"></span></span><span class="step-name">Starting...</span></div></div></div>`;
        container.appendChild(panel);
        return panel;
    }

    function removeProgressPanel(panelId, delay = 0) {
        setTimeout(() => {
            const panel = document.getElementById(panelId);
            if (panel) panel.remove();
        }, delay);
    }

    function renderProgress(data, stepsContainer) {
        if (!data.steps || data.steps.length === 0) {
            stepsContainer.innerHTML = '<div class="progress-step"><span class="step-icon running"><span class="spinner"></span></span><span class="step-name">Starting...</span></div>';
            return;
        }

        stepsContainer.innerHTML = data.steps.map(s => {
            let icon = '';
            switch (s.status) {
                case 'ok': icon = '<span class="step-icon ok">&#10003;</span>'; break;
                case 'failed': icon = '<span class="step-icon failed">&#10007;</span>'; break;
                case 'running': icon = '<span class="step-icon running"><span class="spinner"></span></span>'; break;
                case 'skipped': icon = '<span class="step-icon skipped">&#8212;</span>'; break;
                default: icon = '<span class="step-icon pending">&#9675;</span>';
            }
            const count = s.items_total > 0 ? `<span class="step-count">${s.items_done}/${s.items_total}</span>` : '';
            const detail = s.detail ? `<span class="step-detail">${s.detail}</span>` : '';
            return `<div class="progress-step">${icon}<span class="step-name">${s.name}</span>${count}${detail}</div>`;
        }).join('');
    }

    function updateQueueState(data, queuedSet, key) {
        const first = data && data.steps && data.steps[0];
        const isQueued = first && first.name === 'Queued' && first.status === 'running';
        const wasQueued = queuedSet.has(key);
        if (isQueued) {
            queuedSet.add(key);
            // Detail looks like "Position 2 of 3 in queue" → keep just "2 of 3"
            const m = (first.detail || '').match(/Position (\d+) of (\d+)/);
            queuePositions.set(key, m ? (m[1] + ' of ' + m[2]) : '');
        } else {
            queuedSet.delete(key);
            queuePositions.delete(key);
        }
        return wasQueued !== isQueued;
    }

    async function pollProgress(deploymentId, scenarioId) {
        const panelId = 'progress-panel-deploy-' + deploymentId;
        const panel = document.getElementById(panelId);
        if (!panel) return;
        const stepsContainer = panel.querySelector('.progress-steps-inner');

        try {
            const url = deploymentId ? '/api/setup/progress?deployment_id=' + deploymentId : '/api/setup/progress';
            const resp = await fetch(url);
            const data = await resp.json();
            renderProgress(data, stepsContainer);

            if (scenarioId && updateQueueState(data, queuedDeployIds, scenarioId)) {
                renderScenarios();
            }

            if (data.finished) {
                if (scenarioId) {
                    deployingIds.delete(scenarioId);
                    queuedDeployIds.delete(scenarioId);
                    queuePositions.delete(scenarioId);
                    deployOrder.delete(scenarioId);
                }
                if (data.error) {
                    panel.querySelector('h2').textContent += ' — Failed';
                    if (scenarioId) cardErrors.set(scenarioId, 'Deployment failed — see progress for details');
                    renderScenarios();
                } else {
                    if (scenarioId) cardErrors.delete(scenarioId);
                    refreshDeployments();
                    removeProgressPanel(panelId, 3000);
                }
                return;
            }
        } catch (e) {}

        setTimeout(() => pollProgress(deploymentId, scenarioId), 1500);
    }

    function showConfirm(message) {
        return new Promise(resolve => {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:9999;';
            overlay.innerHTML = `
                <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:28px 32px;max-width:420px;width:90%;">
                    <p style="color:var(--text);font-size:14px;margin-bottom:24px;line-height:1.5;">${message}</p>
                    <div style="display:flex;gap:12px;justify-content:flex-end;">
                        <button id="_confirm-cancel" style="background:var(--white);color:var(--text);border:1.5px solid var(--border-card);border-radius:8px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">Cancel</button>
                        <button id="_confirm-ok" style="background:#BD271E;color:#fff;border:none;border-radius:8px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">Stop &amp; Teardown</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('#_confirm-ok').onclick = () => { document.body.removeChild(overlay); resolve(true); };
            overlay.querySelector('#_confirm-cancel').onclick = () => { document.body.removeChild(overlay); resolve(false); };
        });
    }

    async function stopAndTeardown(deploymentId) {
        // Find the scenario name for display
        const dep = activeDeployments.find(d => d.deployment_id === deploymentId);
        const scenarioName = dep ? dep.scenario_name : deploymentId;
        const scenarioId = dep ? dep.scenario_id : null;
        if (!await showConfirm('Stop generators and remove artifacts for <strong>' + scenarioName + '</strong>?')) return;

        // Grey out only this deployment's teardown button immediately
        tearingDownIds.add(deploymentId);
        noteTeardownOrder(deploymentId);
        if (scenarioId) tearingDownScenarioIds.add(scenarioId);
        renderScenarios();

        // Create a dedicated progress panel for this teardown
        const panelId = 'progress-panel-teardown-' + deploymentId;
        createProgressPanel(panelId, 'Removing ' + scenarioName + '…');

        try {
            const resp = await fetch('/api/setup/stop-and-teardown', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ deployment_id: deploymentId }),
            });
            const data = await resp.json();
            if (data.status === 'stopping') {
                pollTeardownProgress(deploymentId, scenarioName, scenarioId);
            } else if (data.ok) {
                // Legacy sync response (no credentials case)
                tearingDownIds.delete(deploymentId);
                teardownOrder.delete(deploymentId);
                if (scenarioId) tearingDownScenarioIds.delete(scenarioId);
                removeProgressPanel(panelId);
                const msg = document.getElementById('status-msg');
                msg.textContent = 'Teardown complete for ' + scenarioName;
                msg.className = 'status-msg visible ok';
                refreshDeployments();
            } else {
                tearingDownIds.delete(deploymentId);
                teardownOrder.delete(deploymentId);
                if (scenarioId) tearingDownScenarioIds.delete(scenarioId);
                removeProgressPanel(panelId);
                renderScenarios();
                alert('Teardown failed: ' + (data.error || 'Unknown error'));
            }
        } catch (e) {
            tearingDownIds.delete(deploymentId);
            teardownOrder.delete(deploymentId);
            if (scenarioId) tearingDownScenarioIds.delete(scenarioId);
            removeProgressPanel(panelId);
            renderScenarios();
            alert('Teardown error: ' + e.message);
        }
    }

    async function pollTeardownProgress(deploymentId, scenarioName, scenarioId) {
        const panelId = 'progress-panel-teardown-' + deploymentId;
        const panel = document.getElementById(panelId);
        if (!panel) return;
        const stepsContainer = panel.querySelector('.progress-steps-inner');

        try {
            const resp = await fetch('/api/setup/teardown-progress?deployment_id=' + deploymentId);
            const data = await resp.json();
            renderProgress(data, stepsContainer);

            if (updateQueueState(data, queuedTeardownIds, deploymentId)) {
                renderScenarios();
            }

            if (data.finished) {
                tearingDownIds.delete(deploymentId);
                queuedTeardownIds.delete(deploymentId);
                queuePositions.delete(deploymentId);
                teardownOrder.delete(deploymentId);
                if (scenarioId) tearingDownScenarioIds.delete(scenarioId);
                panel.querySelector('h2').textContent = scenarioName + ' removed';
                refreshDeployments();
                removeProgressPanel(panelId, 3000);
                return;
            }
        } catch (e) {}

        setTimeout(() => pollTeardownProgress(deploymentId, scenarioName, scenarioId), 1500);
    }

    init();
</script>
</body>
</html>
